<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-zh="灾难：新的平衡｜创作过程" data-en="Making Process | Catastrophe Merely a fresh balance" >灾难：新的平衡｜创作过程</title>
    <style>
        /* Base Styles */
        :root {
            --primary: #5b6b5b;
            --secondary: #3d4d3d;
            --accent: #f5f5dc;
            --text: #ffffff;
            --highlight: #e6e6c8;
            --pixel-size: 4px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Silkscreen', 'VT323', monospace;
            background-color: var(--primary);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }
        
        /* Header */
        header {
            padding: 2rem;
            text-align: center;
            border-bottom: var(--pixel-size) solid var(--accent);
            background-color: var(--secondary);
        }
        
        .back-button {
            display: inline-block;
            margin-bottom: 1rem;
            padding: 0.8rem 1.5rem;
            font-family: 'Silkscreen', 'VT323', monospace;
            font-size: 1.2rem;
            color: var(--secondary);
            background-color: var(--accent);
            text-decoration: none;
            cursor: pointer;
            position: relative;
            transition: transform 0.1s;
            border: none;
        }
        
        .back-button:hover {
            transform: translateY(2px);
        }
        
        .page-title {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .subtitle {
            font-size: 1.5rem;
            color: var(--highlight);
            margin-bottom: 1rem;
        }
        
        /* Main Content */
        .process-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .section-title {
            font-size: 2.5rem;
            color: var(--accent);
            margin: 2rem 0 1.5rem 0;
            text-transform: uppercase;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 0.5rem;
            letter-spacing: 2px;
        }
        
        .process-section {
            margin-bottom: 4rem;
        }
        
        .process-text {
            font-size: 1.4rem;
            margin-bottom: 2rem;
            max-width: 800px;
        }
        
        /* 图片网格 - 两列 */
        .image-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2rem;
            margin: 2rem 0;
        }
        
        .image-card {
            border: 2px solid var(--accent);
            padding: 1rem;
            background-color: var(--secondary);
            transition: transform 0.2s;
        }
        
        .image-card:hover {
            transform: translateY(-5px);
        }
        
        .process-image {
            width: 100%;
            height: auto;
            display: block;
        }
        
        /* 角色展示 */
        .character-container {
            margin-top: 2rem;
        }
        
        .character-card {
            margin-bottom: 3rem;
            border: 2px solid var(--accent);
            padding: 1.5rem;
            background-color: var(--secondary);
        }
        
        .character-name {
            font-size: 2rem;
            color: var(--accent);
            margin-bottom: 1rem;
            text-align: center;
        }
        
        .character-image {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }
        
        /* 按钮容器 */
        .button-container {
            display: flex;
            justify-content: space-between;
            margin-top: 3rem;
        }
        
        .nav-button {
            display: inline-block;
            padding: 0.8rem 1.5rem;
            font-family: 'Silkscreen', 'VT323', monospace;
            font-size: 1.2rem;
            color: var(--secondary);
            background-color: var(--accent);
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.1s;
        }
        
        .nav-button:hover {
            transform: translateY(2px);
        }
        
        /* Footer */
        footer {
            text-align: center;
            padding: 2rem;
            font-size: 1.2rem;
            color: var(--accent);
            border-top: var(--pixel-size) solid var(--accent);
            background-color: var(--secondary);
            margin-top: 3rem;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .page-title {
                font-size: 2.5rem;
            }
            
            .subtitle {
                font-size: 1.2rem;
            }
            
            .section-title {
                font-size: 2rem;
            }
            
            .process-text {
                font-size: 1.2rem;
            }
            
            .button-container {
                flex-direction: column;
                gap: 1rem;
                align-items: center;
            }
            
            .image-grid {
                grid-template-columns: 1fr;
            }
            
            .character-name {
                font-size: 1.8rem;
            }
        }
    </style>
<link rel="stylesheet" href="localization.css">
<script src="language.js" defer></script>
</head>
<body>
<nav class="language-nav" aria-label="Language / 语言"><a class="brand" href="index.html">JH<span> / PORTFOLIO</span></a><div class="language-controls"><button type="button" data-language="zh" aria-pressed="true">中文</button><button type="button" data-language="en" aria-pressed="false">EN</button></div></nav>
    <header>
        <a data-zh="← 返回项目" data-en="← Back to Project"  href="project1.html" class="back-button">← 返回项目</a>
        <h1 data-zh="灾难" data-en="Catastrophe"  class="page-title">灾难</h1>
        <p data-zh="新的平衡 · 创作过程" data-en="Merely a fresh balance - Making Process"  class="subtitle">新的平衡 · 创作过程</p>
    </header>
    
    <main class="process-container">
        <!-- 游戏艺术部分  -->
        <section class="process-section">
            <h2 data-zh="游戏美术" data-en="Game Art"  class="section-title">游戏美术</h2>
            
            <!-- 第一行图片 -->
            <div class="image-grid">
                <div class="image-card">
                    <img src="making-process/1.png" alt="Game Art 1" class="process-image">
                </div>
                <div class="image-card">
                    <img src="making-process/2.png" alt="Game Art 2" class="process-image">
                </div>
            </div>
            
            <!-- 第二行图片 -->
            <div class="image-grid">
                <div class="image-card">
                    <img src="making-process/3.png" alt="Game Art 3" class="process-image">
                </div>
                <div class="image-card">
                    <img src="making-process/4.png" alt="Game Art 4" class="process-image">
                </div>
            </div>
        </section>
        
        <!-- 角色设计部分 -->
        <section class="process-section">
            <h2 data-zh="角色设计" data-en="Character Design"  class="section-title">角色设计</h2>
            <p data-zh="角色从生态系统中的不同生命形态出发，通过造型与视觉特征建立各自的身份。以下展示 Hydropteron、Streambloom、Crimson Satincap Fungus 与 Bobi 的角色设计。" data-en="Each character in the game represents a different aspect of the ecosystem. The design process involved creating unique visual identities for entities like Hydropteron, Streambloom, and the Crimson Satincap Fungus."  class="process-text">角色从生态系统中的不同生命形态出发，通过造型与视觉特征建立各自的身份。以下展示 Hydropteron、Streambloom、Crimson Satincap Fungus 与 Bobi 的角色设计。</p>
            
            <div class="character-container">
                <!-- Hydropteron  -->
                <div class="character-card">
                    <h3 class="character-name">Hydropteron</h3>
                    <img src="making-process/5.png" alt="Hydropteron Character" class="character-image">
                </div>
                
                <!-- Streambloom  -->
                <div class="character-card">
                    <h3 class="character-name">Streambloom</h3>
                    <img src="making-process/6.png" alt="Streambloom Character" class="character-image">
                </div>
                
                <!-- Crimson Satincap Fungus  -->
                <div class="character-card">
                    <h3 class="character-name">Crimson Satincap Fungus</h3>
                    <img src="making-process/7.png" alt="Crimson Satincap Fungus Character" class="character-image">
                </div>
                
                <!-- Bobi  -->
                <div class="character-card">
                    <h3 class="character-name">Bobi</h3>
                    <img src="making-process/8.png" alt="Bobi Character" class="character-image">
                </div>
            </div>
        </section>
        
        <!-- 导航按钮 -->
        <div class="button-container">
            <a data-zh="← 返回项目" data-en="← Back to Project"  href="project1.html" class="nav-button">← 返回项目</a>
            <a data-zh="返回首页" data-en="Home Page"  href="index.html" class="nav-button">返回首页</a>
        </div>
    </main>
    
    <footer>
        <p data-zh="© 2026 JIANG Hanbing · 个人作品集" data-en="© 2025 JIANG Hanbing. All rights reserved." >© 2026 JIANG Hanbing · 个人作品集</p>
    </footer>
